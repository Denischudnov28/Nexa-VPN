name: Typecheck and Android native build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - run: npm install
      - name: TypeScript validation
        run: npm run typecheck
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Verify NEXA native module integration
        run: |
          test -f android/app/src/main/java/app/nexa/vpn/NexaVpnModule.kt
          test -f android/app/src/main/java/app/nexa/vpn/NexaWireGuardController.kt
          grep -R -q 'NexaVpnPackage()' android/app/src/main/java
          grep -q 'com.wireguard.android:tunnel:' android/app/build.gradle
          grep -q 'coreLibraryDesugaringEnabled true' android/app/build.gradle
      - name: Compile Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon :app:assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
