name: Typecheck and Android native build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexa_test
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Backend production build
        working-directory: backend
        run: npm run build
      - name: Validate PostgreSQL migration
        env:
          PGPASSWORD: nexa_test_password
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U nexa -d nexa_test -v ON_ERROR_STOP=1 -f backend/migrations/001_initial_schema.sql
          psql -h 127.0.0.1 -U nexa -d nexa_test -v ON_ERROR_STOP=1 -f backend/migrations/002_auth_sessions.sql\n          psql -h 127.0.0.1 -U nexa -d nexa_test -v ON_ERROR_STOP=1 -f backend/migrations/003_gateway_jobs.sql\n          psql -h 127.0.0.1 -U nexa -d nexa_test -v ON_ERROR_STOP=1 -f backend/migrations/004_gateway_agent_auth.sql\n          psql -h 127.0.0.1 -U nexa -d nexa_test -v ON_ERROR_STOP=1 -f backend/migrations/005_gateway_ip_pools.sql

  gateway-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test gateway agent
        working-directory: gateway-agent
        run: |
          go test ./...
          go build -trimpath -o /tmp/nexa-gateway-agent .

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - run: npm install
      - name: TypeScript validation
        run: npm run typecheck
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Verify NEXA native module integration
        run: |
          test -f android/app/src/main/java/app/nexa/vpn/NexaVpnModule.kt
          test -f android/app/src/main/java/app/nexa/vpn/NexaWireGuardController.kt
          grep -R -q 'NexaVpnPackage()' android/app/src/main/java
          grep -q 'com.wireguard.android:tunnel:' android/app/build.gradle
          grep -q 'coreLibraryDesugaringEnabled true' android/app/build.gradle
      - name: Compile Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon :app:assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
