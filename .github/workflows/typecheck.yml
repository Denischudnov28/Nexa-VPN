name: Typecheck and Android prebuild validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: TypeScript validation
        run: npm run typecheck
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Verify NEXA native module integration
        run: |
          test -f android/app/src/main/java/app/nexa/vpn/NexaVpnModule.kt
          test -f android/app/src/main/java/app/nexa/vpn/NexaWireGuardController.kt
          grep -R -q 'NexaVpnPackage()' android/app/src/main/java
          grep -q 'com.wireguard.android:tunnel:' android/app/build.gradle
          grep -q 'coreLibraryDesugaringEnabled true' android/app/build.gradle
